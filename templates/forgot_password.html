<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — My Reading Alcove</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a2e; color: #e0d7c6; font-family: 'DM Sans', sans-serif;
           min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; }
    h1 { font-family: 'DM Serif Display', serif; font-size: 2rem; color: #c9a96e; margin-bottom: 0.25rem; }
    .subtitle { color: #888; font-size: 0.9rem; margin-bottom: 2rem; }
    .card { background: #16213e; border: 1px solid #2a2a4a; border-radius: 12px; padding: 2rem; width: 100%; max-width: 400px; }
    .field { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 0.4rem; }
    input { width: 100%; padding: 0.65rem 0.9rem; background: #0f1429; border: 1px solid #2a2a4a;
            border-radius: 8px; color: #e0d7c6; font-size: 1rem; outline: none; }
    input:focus { border-color: #c9a96e; }
    .btn { width: 100%; padding: 0.75rem; background: #c9a96e; color: #1a1a2e;
           border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem; }
    .btn:hover { background: #dbbe8a; }
    .success { background: #1a3d1a; border: 1px solid #3a8b3a; color: #4f8; border-radius: 8px; padding: 0.65rem 0.9rem; margin-bottom: 1rem; font-size: 0.9rem; }
    .footer-link { text-align: center; margin-top: 1.25rem; font-size: 0.9rem; color: #888; }
    .footer-link a { color: #c9a96e; text-decoration: none; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <h1>My Reading Alcove</h1>
  <p class="subtitle">Your personal library</p>
  <div class="card">
    <h2 style="margin-bottom:1.25rem;font-size:1.25rem;">Reset Password</h2>
    {% if sent %}
      <div class="success">If that email exists, a reset link is on its way. Check your inbox.</div>
      <div class="footer-link"><a href="/login">Back to Log In</a></div>
    {% else %}
      <form method="POST">
        <div class="field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <button class="btn" type="submit">Send Reset Link</button>
      </form>
      <div class="footer-link"><a href="/login">Back to Log In</a></div>
    {% endif %}
  </div>
</body>
</html>
