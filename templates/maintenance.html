<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Reading Alcove — Back Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a2e;
      color: #e8e0d0;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .candle { font-size: 4rem; margin-bottom: 1.5rem; animation: flicker 2.5s ease-in-out infinite; }
    @keyframes flicker {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(0.97); }
    }
    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      color: #c9a96e;
      margin-bottom: 1rem;
      line-height: 1.2;
    }
    p {
      font-size: 1.1rem;
      color: #b0a898;
      max-width: 420px;
      line-height: 1.7;
    }
    .dot { display: inline-block; animation: bounce 1.4s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
  </style>
</head>
<body>
  <div class="candle">📖</div>
  <h1>My Reading Alcove</h1>
  <p>
    We're making some improvements to your reading room.
    Be back soon<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
  </p>
</body>
</html>
