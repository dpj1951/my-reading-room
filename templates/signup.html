<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – My Reading Alcove</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #d4d0c8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
    }
    .card {
      background: #2c2c2c;
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    h1 { font-family: 'DM Serif Display', serif; color: #6aafe6; font-size: 2rem; text-align: center; margin-bottom: 8px; }
    .subtitle { color: #999; text-align: center; font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 32px; }
    .error { background: #5c2020; color: #ffaaaa; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; font-size: 0.9rem; }
    .hint { color: #777; font-size: 0.8rem; margin-top: -14px; margin-bottom: 16px; }
    label { display: block; color: #ccc; font-size: 0.85rem; margin-bottom: 6px; }
    input[type=email], input[type=password] {
      width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid #444;
      background: #1e1e1e; color: #eee; font-family: 'DM Sans', sans-serif; font-size: 1rem; margin-bottom: 20px;
    }
    input:focus { outline: none; border-color: #6aafe6; }
    .btn { width: 100%; padding: 14px; border-radius: 8px; border: none; background: #3a3a3a; color: #eee;
      font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 500; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #4a4a4a; }
    .links { margin-top: 24px; text-align: center; font-size: 0.88rem; color: #888; }
    .links a { color: #6aafe6; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>My Reading Alcove</h1>
    <p class="subtitle">Create your account</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="new-password" minlength="6">
      <p class="hint">At least 6 characters</p>
      <button type="submit" class="btn">Create Account</button>
    </form>
    <div class="links">Already have an account? <a href="/login">Sign in</a></div>
  </div>
</body>
</html>
