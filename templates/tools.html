<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools -- My Reading Alcove</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #d8d8d8; --card: #3a3a3a; --border: #4a4a4a;
      --accent: #3b9eff; --text: #f0ede8; --muted: #8a8795;
      --radius: 16px; --shadow: 0 6px 20px rgba(0,0,0,0.6);
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 40px 24px; }
    .brand { text-align: center; margin-bottom: 48px; }
    .brand h1 { font-family: 'DM Serif Display', serif; font-size: clamp(2rem,8vw,3.2rem);
      color: var(--accent); letter-spacing: 0.04em; margin-bottom: 8px; }
    .brand p { color: var(--muted); font-size: 0.95rem; font-weight: 300;
      letter-spacing: 0.08em; text-transform: uppercase; }
    .menu { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 360px; }
    .menu-btn { display: block; background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px;
      text-align: center; text-decoration: none; color: var(--text);
      font-family: 'DM Serif Display', serif; font-size: 1.2rem; letter-spacing: 0.02em;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s, background 0.15s;
      cursor: pointer; width: 100%; border: none; }
    .menu-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,0.7);
      border-color: var(--accent); background: #22222e; }
    .menu-btn .icon { display: block; font-size: 1.6rem; margin-bottom: 6px; }
    .menu-btn .sub { display: block; font-family: 'DM Sans', sans-serif; font-size: 0.78rem;
      color: var(--muted); font-weight: 300; margin-top: 3px; letter-spacing: 0.04em; }
    .progress-box { width: 100%; max-width: 360px; background: #2a2a2a; border: 1px solid #444;
      border-radius: var(--radius); padding: 20px; display: none; flex-direction: column; gap: 12px; }
    .progress-box.active { display: flex; }
    .progress-label { font-family: 'DM Serif Display', serif; font-size: 1rem; color: var(--text); text-align: center; }
    .progress-bar-track { width: 100%; height: 8px; background: #444; border-radius: 4px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.2s; width: 0%; }
    .progress-count { font-size: 0.8rem; color: var(--muted); text-align: center; }
    .download-btn { display: block; background: #1a3a1a; border: 1px solid #3a7a3a; border-radius: 10px;
      padding: 14px; text-align: center; color: #7dcc7d; font-family: 'DM Serif Display', serif;
      font-size: 1.1rem; cursor: pointer; text-decoration: none; margin-top: 4px; }
    .back-link { margin-top: 32px; color: var(--muted); font-size: 0.85rem;
      text-decoration: none; letter-spacing: 0.04em; transition: color 0.15s; }
    .back-link:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="brand">
    <h1>More Tools</h1>
    <p>Advanced library utilities</p>
  </div>

  <nav class="menu">

    <button type="button" class="menu-btn" id="backfillBtn" onclick="startBackfill()">
      <span class="icon">&#x1F522;</span> Backfill ISBN-13
      <span class="sub">Update missing ISBNs from Open Library</span>
    </button>
    <div class="progress-box" id="backfillBox">
      <div class="progress-label" id="backfillLabel">Looking up ISBNs...</div>
      <div class="progress-bar-track"><div class="progress-bar-fill" id="backfillFill"></div></div>
      <div class="progress-count" id="backfillCount">0 / 0</div>
    </div>

    <button type="button" class="menu-btn" id="coverBtn" onclick="startCoverBackfill()">
      <span class="icon">&#x1F5BC;&#xFE0F;</span> Backfill Book Covers
      <span class="sub">Find missing covers from Open Library &amp; Google Books</span>
    </button>
    <div class="progress-box" id="coverBox">
      <div class="progress-label" id="coverLabel">Looking up covers...</div>
      <div class="progress-bar-track"><div class="progress-bar-fill" id="coverFill"></div></div>
      <div class="progress-count" id="coverCount">0 / 0</div>
    </div>

    <input type="file" id="enrichFile" accept=".csv" style="display:none">
    <button type="button" class="menu-btn" onclick="document.getElementById('enrichFile').click()">
      <span class="icon">&#x1F50D;</span> Enrich from Google Books
      <span class="sub">Upload a CSV with title &amp; author -- lookups run in your browser</span>
    </button>
    <div class="progress-box" id="progressBox">
      <div class="progress-label" id="progressLabel">Looking up books...</div>
      <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
      <div class="progress-count" id="progressCount">0 / 0</div>
      <a class="download-btn" id="downloadBtn" style="display:none" href="#">Download enriched_books.csv</a>
    </div>

    <button type="button" class="menu-btn" id="dedupBtn" onclick="startDedup()">
      <span class="icon">&#x1F9F9;</span> Remove Duplicate Books
      <span class="sub">Find and delete duplicate entries in your library</span>
    </button>
    <div class="progress-box" id="dedupProgress" style="display:none">
      <div class="progress-bar-track"><div class="progress-bar-fill" id="dedupFill"></div></div>
      <div class="progress-count" id="dedupCount">Running...</div>
    </div>


    <button type="button" class="menu-btn" id="missingPagesBtn" onclick="startMissingPages()">
      <span class="icon">&#x1F4D6;</span> Find &amp; Fill Missing Page Counts
      <span class="sub">Auto-lookup page counts from Open Library &amp; Google Books</span>
    </button>
    <div class="progress-box" id="missingPagesBox" style="display:none">
      <div class="progress-label" id="missingPagesLabel">Scanning library...</div>
      <div class="progress-bar-track"><div class="progress-bar-fill" id="missingPagesFill"></div></div>
      <div class="progress-count" id="missingPagesCount"></div>
      <div id="missingPagesList" style="margin-top:12px;width:100%;max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;"></div>
    </div>



    <button type="button" class="menu-btn" id="missingDatesBtn" onclick="startMissingDates()">
      <span class="icon">&#x1F4C5;</span> Find Missing Read Dates
      <span class="sub">List books with no read date recorded</span>
    </button>
    <div class="progress-box" id="missingDatesBox" style="display:none">
      <div class="progress-label" id="missingDatesLabel">Scanning library...</div>
      <div class="progress-bar-track"><div class="progress-bar-fill" id="missingDatesFill"></div></div>
      <div class="progress-count" id="missingDatesCount"></div>
      <div id="missingDatesList" style="margin-top:12px;width:100%;max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;"></div>
    </div>

        <button type="button" class="menu-btn" id="missingSummariesBtn" onclick="startMissingSummaries()">
            <span class="icon">&#x1F4DD;</span> Find Missing Summaries
            <span class="sub">Fill books with no plot summary</span>
        </button>
        <div class="progress-box" id="missingSummariesBox" style="display:none">
            <div class="progress-label" id="missingSummariesLabel">Scanning library...</div>
            <div class="progress-bar-track"><div class="progress-bar-fill" id="missingSummariesFill"></div></div>
            <div class="progress-count" id="missingSummariesCount"></div>
            <div id="missingSummariesList" style="margin-top:12px;width:100%;max-height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;"></div>
        </div>
  </nav>

  <a class="back-link" href="/utilities">&#8592; Back to Utilities</a>

  <script>
  function testImageUrl(url) {
    if (!url) return Promise.resolve(false);
    return new Promise(resolve => {
      const img = new Image();
      const sep = url.includes('?') ? '&' : '?';
      const busted = url + sep + '_cb=' + Date.now();
      const timer = setTimeout(() => { img.src = ''; resolve(false); }, 7000);
      img.onload = () => { clearTimeout(timer); resolve(img.naturalWidth > 10 && img.naturalHeight > 10); };
      img.onerror = () => { clearTimeout(timer); resolve(false); };
      img.src = busted;
    });
  }

  async function startCoverBackfill() {
    const btn = document.getElementById('coverBtn');
    const box = document.getElementById('coverBox');
    const label = document.getElementById('coverLabel');
    const fill = document.getElementById('coverFill');
    const count = document.getElementById('coverCount');
    btn.disabled = true; box.classList.add('active'); fill.style.width = '0%';
    label.textContent = 'Loading library...';
    let allBooks;
    try {
      const r = await fetch('/utilities/all-books-covers');
      allBooks = await r.json();
    } catch(e) { label.textContent = 'Error: ' + e.message; btn.disabled = false; return; }
    label.textContent = 'Testing existing cover images...';
    const needsUpdate = [];
    for (let i = 0; i < allBooks.length; i++) {
      const book = allBooks[i];
      count.textContent = (i + 1) + ' / ' + allBooks.length;
      fill.style.width = ((i + 1) / allBooks.length * 45) + '%';
      const ok = await testImageUrl(book.cover_url);
      if (!ok) needsUpdate.push(book);
    }
    if (!needsUpdate.length) {
      label.textContent = 'All books already have valid covers!';
      fill.style.width = '100%'; count.textContent = '0 books needed covers';
      btn.disabled = false; return;
    }
    const total = needsUpdate.length;
    label.textContent = 'Found ' + total + ' book(s) needing covers...';
    count.textContent = '0 / ' + total;
    const updates = [];
    for (let i = 0; i < needsUpdate.length; i++) {
      const book = needsUpdate[i];
      count.textContent = (i + 1) + ' / ' + total;
      fill.style.width = (45 + ((i + 1) / total * 50)) + '%';
      label.textContent = book.title;
      let coverUrl = '';
      if (!coverUrl && book.isbn) {
        try {
          const r = await fetch('https://openlibrary.org/search.json?isbn=' + encodeURIComponent(book.isbn) + '&fields=cover_i&limit=1');
          const json = await r.json();
          const doc = (json.docs || [])[0];
          if (doc && doc.cover_i) coverUrl = 'https://covers.openlibrary.org/b/id/' + doc.cover_i + '-M.jpg';
        } catch(e) {}
      }
      if (!coverUrl) {
        try {
          const p = new URLSearchParams({ title: book.title, author: book.author, limit: 3, fields: 'cover_i' });
          const r = await fetch('https://openlibrary.org/search.json?' + p);
          const json = await r.json();
          for (const doc of (json.docs || [])) {
            if (doc.cover_i) { coverUrl = 'https://covers.openlibrary.org/b/id/' + doc.cover_i + '-M.jpg'; break; }
          }
        } catch(e) {}
      }
      if (!coverUrl && book.isbn) {
        try {
          const directUrl = 'https://covers.openlibrary.org/b/isbn/' + encodeURIComponent(book.isbn) + '-M.jpg';
          const confirmed = await testImageUrl(directUrl);
          if (confirmed) coverUrl = directUrl;
        } catch(e) {}
      }
      if (!coverUrl) {
        try {
          const p = new URLSearchParams({ title: book.title, author: book.author || '', isbn: book.isbn || '' });
          const r = await fetch('/utilities/cover-lookup?' + p);
          const json = await r.json();
          coverUrl = json.cover_url || '';
        } catch(e) {}
      }
      if (coverUrl) updates.push({ id: book.id, cover_url: coverUrl });
      await new Promise(r => setTimeout(r, 200));
    }
    fill.style.width = '95%';
    if (!updates.length) {
      label.textContent = 'No covers found for any of the ' + total + ' missing book(s).';
      count.textContent = '0 / ' + total + ' updated'; btn.disabled = false; return;
    }
    label.textContent = 'Saving ' + updates.length + ' cover(s)...';
    try {
      const r = await fetch('/utilities/backfill-covers-save', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updates)
      });
      const result = await r.json();
      label.textContent = 'Done! ' + result.updated + ' cover(s) updated.';
      count.textContent = (total - updates.length) + ' still not found';
      fill.style.width = '100%';
    } catch(e) { label.textContent = 'Save failed: ' + e.message; }
    btn.disabled = false;
  }

  async function startBackfill() {
    const btn = document.getElementById('backfillBtn');
    const box = document.getElementById('backfillBox');
    const label = document.getElementById('backfillLabel');
    const fill = document.getElementById('backfillFill');
    const count = document.getElementById('backfillCount');
    btn.disabled = true; box.classList.add('active'); label.textContent = 'Fetching books needing ISBNs...'; fill.style.width = '0%';
    let books;
    try {
      const r = await fetch('/utilities/backfill-isbn-data');
      books = await r.json();
    } catch(e) { label.textContent = 'Error: ' + e.message; btn.disabled = false; return; }
    if (!books.length) {
      label.textContent = 'All books already have ISBN-13!';
      fill.style.width = '100%'; count.textContent = '0 books needed updating'; btn.disabled = false; return;
    }
    const total = books.length;
    count.textContent = '0 / ' + total; label.textContent = 'Searching Open Library...';
    const updates = [];
    for (let i = 0; i < books.length; i++) {
      const book = books[i];
      count.textContent = (i + 1) + ' / ' + total;
      fill.style.width = ((i + 1) / total * 100) + '%';
      label.textContent = book.title;
      try {
        const params = new URLSearchParams({ title: book.title, author: book.author, limit: 3, fields: 'isbn' });
        const r = await fetch('https://openlibrary.org/search.json?' + params);
        const json = await r.json();
        let isbn13 = '';
        for (const doc of (json.docs || [])) {
          isbn13 = (doc.isbn || []).find(i => i.length === 13 && /^\d+$/.test(i)) || '';
          if (isbn13) break;
        }
        if (!isbn13) {
          try {
            const gbParams = new URLSearchParams({ title: book.title, author: book.author || '' });
            const gbR = await fetch('/utilities/isbn-lookup?' + gbParams);
            const gbJson = await gbR.json();
            isbn13 = gbJson.isbn13 || '';
          } catch(e2) {}
        }
        if (isbn13) updates.push({ id: book.id, isbn: isbn13 });
      } catch(e) {}
      await new Promise(r => setTimeout(r, 350));
    }
    if (!updates.length) {
      label.textContent = 'No ISBN-13s found.'; count.textContent = '0 / ' + total + ' updated'; btn.disabled = false; return;
    }
    label.textContent = 'Saving ' + updates.length + ' ISBN-13s...';
    try {
      const saveR = await fetch('/utilities/backfill-isbn-save', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updates)
      });
      const result = await saveR.json();
      label.textContent = 'Done! ' + result.updated + ' book(s) updated.';
      count.textContent = (total - updates.length) + ' not found'; fill.style.width = '100%';
    } catch(e) { label.textContent = 'Save failed: ' + e.message; }
    btn.disabled = false;
  }

  async function startDedup() {
    const btn = document.getElementById('dedupBtn');
    const progress = document.getElementById('dedupProgress');
    const countEl = document.getElementById('dedupCount');
    const fill = document.getElementById('dedupFill');
    btn.disabled = true; progress.style.display = 'flex'; fill.style.width = '50%';
    countEl.textContent = 'Searching for duplicates...';
    try {
      const resp = await fetch('/utilities/remove-duplicates', { method: 'POST' });
      const data = await resp.json();
      fill.style.width = '100%';
      countEl.textContent = data.deleted === 0 ? 'No duplicates found!' : 'Done! Removed ' + data.deleted + ' duplicate book(s).';
    } catch (e) { countEl.textContent = 'Error: ' + e.message; }
    btn.disabled = false;
  }

  async function startMissingPages() {
    const btn = document.getElementById('missingPagesBtn');
    const box = document.getElementById('missingPagesBox');
    const label = document.getElementById('missingPagesLabel');
    const fill = document.getElementById('missingPagesFill');
    const count = document.getElementById('missingPagesCount');
    const list = document.getElementById('missingPagesList');
    btn.disabled = true;
    box.style.display = 'block';
    list.innerHTML = '';
    label.textContent = 'Scanning library...';
    fill.style.width = '10%';
    count.textContent = '';

    // Step 1: get books missing pages
    let books = [];
    try {
      const r = await fetch('/utilities/missing-pages');
      const data = await r.json();
      if (data.error) { label.textContent = 'Error: ' + data.error; btn.disabled = false; return; }
      books = data.books || [];
    } catch(e) { label.textContent = 'Error: ' + e.message; btn.disabled = false; return; }

    if (books.length === 0) {
      fill.style.width = '100%';
      label.textContent = '\u2705 All books have page counts!';
      btn.disabled = false;
      return;
    }

    // Step 2: look up page counts
    label.textContent = 'Looking up page counts...';
    const total = books.length;
    const updates = [];
    const notFound = [];

    for (let i = 0; i < total; i++) {
      const book = books[i];
      fill.style.width = (10 + ((i + 1) / total * 60)) + '%';
      count.textContent = (i + 1) + ' / ' + total + ' looked up';
      label.textContent = book.title;
      let pages = '';

      // Try Open Library by ISBN first
      if (!pages && book.isbn) {
        try {
          const r = await fetch('https://openlibrary.org/api/books?bibkeys=ISBN:' + encodeURIComponent(book.isbn) + '&format=json&jscmd=data');
          const json = await r.json();
          const key = 'ISBN:' + book.isbn;
          if (json[key] && json[key].number_of_pages) pages = String(json[key].number_of_pages);
        } catch(e) {}
      }

      // Try Open Library search by title+author
      if (!pages) {
        try {
          const q = encodeURIComponent(book.title + ' ' + (book.author || ''));
          const r = await fetch('https://openlibrary.org/search.json?q=' + q + '&limit=3&fields=number_of_pages_median,title');
          const json = await r.json();
          const doc = (json.docs || []).find(d => d.number_of_pages_median && d.number_of_pages_median > 10);
          if (doc) pages = String(doc.number_of_pages_median);
        } catch(e) {}
      }

      // Try Google Books by ISBN
      if (!pages && book.isbn) {
        try {
          const r = await fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:' + encodeURIComponent(book.isbn) + '&maxResults=1');
          const json = await r.json();
          const vol = (json.items || [])[0];
          if (vol && vol.volumeInfo && vol.volumeInfo.pageCount) pages = String(vol.volumeInfo.pageCount);
        } catch(e) {}
      }

      // Try Google Books by title+author
      if (!pages) {
        try {
          const q = encodeURIComponent('intitle:' + book.title + (book.author ? ' inauthor:' + book.author : ''));
          const r = await fetch('https://www.googleapis.com/books/v1/volumes?q=' + q + '&maxResults=3');
          const json = await r.json();
          const vol = (json.items || []).find(v => v.volumeInfo && v.volumeInfo.pageCount && v.volumeInfo.pageCount > 10);
          if (vol) pages = String(vol.volumeInfo.pageCount);
        } catch(e) {}
      }

      if (pages) updates.push({id: book.id, pages, title: book.title, author: book.author});
      else notFound.push(book);
    }

    // Step 3: save found pages
    if (updates.length === 0) {
      fill.style.width = '100%';
      label.textContent = 'No page counts found for ' + total + ' book(s). Try editing manually.';
      count.textContent = '';
      notFound.forEach(b => addRow(list, b, false));
      btn.disabled = false;
      return;
    }

    fill.style.width = '75%';
    label.textContent = 'Saving ' + updates.length + ' page count(s)...';
    count.textContent = '';
    try {
      const r = await fetch('/utilities/missing-pages-save', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(updates)
      });
      const result = await r.json();
      fill.style.width = '100%';
      label.textContent = '\u2705 Updated ' + result.updated + ' book(s).' + (notFound.length ? ' ' + notFound.length + ' not found:' : ' All done!');
      count.textContent = notFound.length ? 'These still need manual entry — click to edit:' : '';
      updates.forEach(b => addRow(list, b, true));
      notFound.forEach(b => addRow(list, b, false));
    } catch(e) { label.textContent = 'Save failed: ' + e.message; }
    btn.disabled = false;
  }

  function addRow(list, b, found) {
    const row = document.createElement('a');
    row.href = '/book/' + b.id + '/edit';
    row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;background:' + (found ? '#1a3a1a' : '#2a2a2a') + ';border-radius:8px;padding:8px 12px;color:#f0ede8;text-decoration:none;font-size:0.85rem;gap:8px;';
    const titleSpan = '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + b.title + '</span>';
    const pagesSpan = found ? '<span style="color:#7dcc7d;white-space:nowrap;">' + b.pages + ' pages</span>' : '<span style="color:#8a8795;white-space:nowrap;">not found</span>';
    row.innerHTML = titleSpan + pagesSpan;
    row.addEventListener('mouseenter', () => row.style.background = found ? '#1f4a1f' : '#333');
    row.addEventListener('mouseleave', () => row.style.background = found ? '#1a3a1a' : '#2a2a2a');
    list.appendChild(row);
  }
  async function startMissingDates() {
    const btn = document.getElementById('missingDatesBtn');
    const box = document.getElementById('missingDatesBox');
    const label = document.getElementById('missingDatesLabel');
    const fill = document.getElementById('missingDatesFill');
    const count = document.getElementById('missingDatesCount');
    const list = document.getElementById('missingDatesList');
    btn.disabled = true;
    box.style.display = 'block';
    list.innerHTML = '';
    label.textContent = 'Scanning library...';
    fill.style.width = '30%';
    count.textContent = '';
    try {
      const r = await fetch('/utilities/missing-dates');
      const data = await r.json();
      fill.style.width = '100%';
      if (data.error) { label.textContent = 'Error: ' + data.error; btn.disabled = false; return; }
      const books = data.books || [];
      if (books.length === 0) {
        label.textContent = '\u2705 All books have read dates!';
      } else {
        label.textContent = books.length + ' book' + (books.length === 1 ? '' : 's') + ' missing read dates:';
        count.textContent = 'Click a title to edit it.';
        books.forEach(b => {
          const row = document.createElement('a');
          row.href = '/book/' + b.id + '/edit';
          row.style.cssText = 'display:flex;justify-content:space-between;align-items:center;background:#2a2a2a;border-radius:8px;padding:8px 12px;color:#f0ede8;text-decoration:none;font-size:0.85rem;gap:8px;';
          const dateHint = b.date_added ? '<span style="color:#5a8a5a;white-space:nowrap;margin-left:8px;font-size:0.8rem;">added ' + b.date_added + '</span>' : '';
          row.innerHTML = '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + b.title + '</span>' +
            '<span style="color:#8a8795;white-space:nowrap;">' + (b.author || '\u2014') + '</span>' + dateHint;
          row.addEventListener('mouseenter', () => row.style.background = '#333');
          row.addEventListener('mouseleave', () => row.style.background = '#2a2a2a');
          list.appendChild(row);
        });
      }
    } catch(e) { label.textContent = 'Error: ' + e.message; }
    btn.disabled = false;
  }
  
    async function startMissingSummaries() {
        const btn = document.getElementById('missingSummariesBtn');
        const box = document.getElementById('missingSummariesBox');
        const label = document.getElementById('missingSummariesLabel');
        const fill = document.getElementById('missingSummariesFill');
        const count = document.getElementById('missingSummariesCount');
        const list = document.getElementById('missingSummariesList');
        btn.disabled = true; box.style.display = 'block'; fill.style.width = '10%';
        label.textContent = 'Scanning library...'; count.textContent = ''; list.innerHTML = '';

        let books = [];
        try {
            const r = await fetch('/utilities/missing-summaries');
            const data = await r.json();
            if (data.error) { label.textContent = 'Error: ' + data.error; btn.disabled = false; return; }
            books = data.books || [];
        } catch(e) { label.textContent = 'Error: ' + e.message; btn.disabled = false; return; }

        if (books.length === 0) {
            fill.style.width = '100%';
            label.textContent = '\u2705 All books have summaries!';
            btn.disabled = false;
            return;
        }

        const total = books.length;
        fill.style.width = '30%';
        label.textContent = total + ' book(s) missing summaries.';
        count.textContent = 'Click Fill Summaries to auto-fill from Google Books / Open Library.';

        const confirmBtn = document.createElement('button');
        confirmBtn.textContent = 'Fill Summaries';
        confirmBtn.className = 'menu-btn';
        confirmBtn.style.cssText = 'margin-top:8px;padding:8px 16px;font-size:0.9rem;';
        list.appendChild(confirmBtn);

        confirmBtn.addEventListener('click', async () => {
            confirmBtn.remove();
            count.textContent = '';
            fill.style.width = '50%';
            label.textContent = 'Filling summaries...';
            try {
                const r = await fetch('/utilities/missing-summaries-save', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(books)
                });
                const result = await r.json();
                fill.style.width = '100%';
                label.textContent = 'Done! ' + result.updated + ' book(s) updated.';
                count.textContent = result.not_found + ' not found.';
            } catch(e) { label.textContent = 'Save failed: ' + e.message; }
            btn.disabled = false;
        });
    }
    </script>
    <script src="/static/enrich.js"></script>
