<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password -- My Reading Alcove</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital@0;1&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: #0e0e12; color: #f0e8df; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
        .card { background: #16161c; border: 1px solid #2a2a36; border-radius: 16px; padding: 2rem; width: 100%; max-width: 400px; }
        h1 { font-family: 'DM Serif Display', serif; font-size: 1.8rem; color: #c9a96e; margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.875rem; color: #8a8795; margin-bottom: 0.4rem; margin-top: 1rem; }
        input[type="email"], input[type="password"] { width: 100%; background: #0e0e12; border: 1px solid #2a2a36; border-radius: 8px; padding: 0.75rem 1rem; color: #f0e8df; font-size: 1rem; outline: none; }
        input:focus { border-color: #3b9eff; }
        button { width: 100%; margin-top: 1.5rem; background: #c9a96e; color: #0e0e12; border: none; border-radius: 8px; padding: 0.875rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
        button:hover { background: #e0c080; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .error { background: #3a1a1a; border: 1px solid #7a3a3a; color: #cc7d7d; padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; }
        .success { background: #1a3a1a; border: 1px solid #3a7a3a; color: #7dcc7d; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.9rem; }
        .success a, .note a { color: #c9a96e; }
        .hidden { display: none; }
        .note { color: #8a8795; font-size: 0.8rem; margin-top: 1rem; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Set New Password</h1>
        {% if done %}
            <div class="success">Password updated! <a href="/login">Log in</a></div>
        {% else %}
            {% if error %}<div class="error" id="serverError">{{ error }}</div>{% endif %}
            <div class="error hidden" id="linkError"></div>
            <form method="POST" action="/reset-password" id="resetForm" class="hidden">
                <input type="hidden" name="access_token" id="accessToken" value="{{ access_token or '' }}">
                <label for="password">New Password</label>
                <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password" autofocus>
                <label for="password2">Confirm Password</label>
                <input type="password" id="password2" name="password2" placeholder="Confirm new password" required autocomplete="new-password">
                <button type="submit" id="submitBtn">Update Password</button>
            </form>
            <p class="note hidden" id="noToken">To reset your password, open the link in the reset email we sent you. Links expire after a short time and can only be used once. <a href="/forgot-password">Request a new link.</a></p>
            <script>
            (function () {
                var tokenInput = document.getElementById('accessToken');
                var hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
                if (hash.get('access_token')) {
                    tokenInput.value = hash.get('access_token');
                } else if (hash.get('error_description')) {
                    var le = document.getElementById('linkError');
                    le.textContent = hash.get('error_description').replace(/\+/g, ' ');
                    le.classList.remove('hidden');
                }
                // Remove the token from the address bar / history
                if (window.location.hash) {
                    history.replaceState(null, '', window.location.pathname);
                }
                if (tokenInput.value) {
                    document.getElementById('resetForm').classList.remove('hidden');
                } else {
                    document.getElementById('noToken').classList.remove('hidden');
                }
                document.getElementById('resetForm').addEventListener('submit', function (e) {
                    var pw = document.getElementById('password').value;
                    var pw2 = document.getElementById('password2').value;
                    if (pw !== pw2) { e.preventDefault(); alert('Passwords do not match.'); return; }
                    document.getElementById('submitBtn').disabled = true;
                });
            })();
            </script>
        {% endif %}
    </div>
</body>
</html>
