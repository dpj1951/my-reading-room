<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password -- My Reading Alcove</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: #0e0e12; color: #f0ede8; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: #16161c; border: 1px solid #2a2a36; border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 400px; }
    h1 { font-family: 'DM Serif Display', serif; font-size: 1.8rem; color: #c9a96e; margin-bottom: 24px; }
    label { display: block; font-size: 0.875rem; color: #8a8795; margin-bottom: 6px; }
    input[type="password"] { width: 100%; background: #0e0e12; border: 1px solid #2a2a36; border-radius: 8px; padding: 12px 14px; color: #f0ede8; font-size: 1rem; outline: none; margin-bottom: 16px; }
    input[type="password"]:focus { border-color: #3b9eff; }
    button { width: 100%; background: #c9a96e; color: #0e0e12; border: none; border-radius: 8px; padding: 14px; font-size: 1rem; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; }
    button:hover { background: #e0c080; }
    .error { background: #3a1a1a; border: 1px solid #7a3a3a; color: #cc7d7d; border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; font-size: 0.9rem; }
    .success { background: #1a3a1a; border: 1px solid #3a7a3a; color: #7dcc7d; border-radius: 8px; padding: 16px 14px; text-align: center; }
    .success a { color: #c9a96e; }
    .loading { color: #8a8795; font-size: 0.9rem; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Set New Password</h1>

    {% if done %}
      <div class="success">
        Password updated! <a href="/login">Log in</a>
      </div>
    {% elif error %}
      <div class="error">{{ error }}</div>
      <p class="loading">The reset link may have expired. <a href="/forgot-password" style="color:#c9a96e;">Request a new one.</a></p>
    {% else %}
      <div id="tokenStatus" class="loading">Reading reset token...</div>
      <form id="resetForm" method="POST" action="/reset-password" style="display:none">
        <input type="hidden" name="access_token" id="accessTokenInput">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6" autofocus>
        <label for="password2">Confirm Password</label>
        <input type="password" id="password2" placeholder="Confirm new password" required>
        <button type="submit" id="submitBtn">Update Password</button>
      </form>
      <script>
        // Handle both PKCE (?code=) and legacy fragment (#access_token=) flows
        (async function() {
            var urlParams = new URLSearchParams(window.location.search);
            var code = urlParams.get('code');
            if (code) {
                try {
                    var res = await fetch('/reset-password/exchange', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({code: code})
                    });
                    var data = await res.json();
                    if (data.access_token) {
                        document.getElementById('accessTokenInput').value = data.access_token;
                        document.getElementById('tokenStatus').style.display = 'none';
                        document.getElementById('resetForm').style.display = 'block';
                        return;
                    }
                } catch(e) {}
                document.getElementById('tokenStatus').textContent = 'Reset link expired or invalid. Please request a new one.';
                return;
            }
            var hash = window.location.hash.substring(1);
            var params = {};
            hash.split('&').forEach(function(p) {
                var parts = p.split('=');
                if (parts[0]) params[decodeURIComponent(parts[0])] = decodeURIComponent(parts[1] || '');
            });
            var token = params['access_token'];
            var type = params['type'];
            if (token && type === 'recovery') {
                document.getElementById('accessTokenInput').value = token;
                document.getElementById('tokenStatus').style.display = 'none';
                document.getElementById('resetForm').style.display = 'block';
            } else {
                document.getElementById('tokenStatus').textContent = 'Invalid or missing reset token. Please request a new one.';
            }
          document.getElementById('resetForm').addEventListener('submit', function(e) {
            var pw = document.getElementById('password').value;
            var pw2 = document.getElementById('password2').value;
            if (pw !== pw2) {
              e.preventDefault();
              alert('Passwords do not match.');
            }
          });
        })();
      </script>
    {% endif %}
  </div>
</body>
</html>
